name: Hermes Agent Platform CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock pytest-asyncio
          pip install -e .

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src tests

      - name: Run Unit & Evaluation Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          GUARDRAILS_TELEMETRY: "0"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest tests/unit tests/evaluation -v

  docker-build:
    name: Build & Validate Containers
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hermes Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hermes-agent:latest

      - name: Build MCP Sandbox SSE Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sandbox
          push: false
          tags: hermes-sandbox-mcp:latest
