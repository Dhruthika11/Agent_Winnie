[project]
name = "hermes-agent-platform"
version = "0.1.0"
description = "Production-ready, Hermes-like agent harness: orchestration, tools, memory, observability, and guardrails."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "litellm>=1.44.0",
    "mem0ai>=0.1.29",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "langfuse>=2.36.0",
    "guardrails-ai>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pyjwt>=2.8.0",
    "pyyaml>=6.0.1",
    "docker>=7.1.0",
    "mcp>=1.2.0",
    "duckduckgo_search>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "deepeval>=1.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
